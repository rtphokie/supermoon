[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supermoon"
dynamic = ["version"]
description = "Find supermoons according to each of the popular (and conflicting) definitions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tony Rice", email = "tony@rtphokie.org"}]
requires-python = ">=3.11"
dependencies = [
    "skyfield>=1.31",
    "numpy",
    "tzlocal",
]
keywords = ["supermoon", "moon", "perigee", "full moon", "astronomy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/rtphokie/supermoon"
Source = "https://github.com/rtphokie/supermoon"
Issues = "https://github.com/rtphokie/supermoon/issues"

[project.scripts]
supermoon = "supermoon.cli:main"

[tool.setuptools]
packages = ["supermoon"]

[tool.setuptools.dynamic]
version = {attr = "supermoon.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "RET",     # flake8-return
    "PTH",     # flake8-use-pathlib
    "PT",      # flake8-pytest-style
    "N",       # pep8-naming
    "RUF",     # ruff-specific
]
