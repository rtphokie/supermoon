[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supermoon"
dynamic = ["version"]
description = "Find supermoons according to each of the popular (and conflicting) definitions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tony Rice", email = "tony@rtphokie.org"}]
requires-python = ">=3.8"
dependencies = [
    "skyfield>=1.31",
    "numpy",
    "tzlocal",
]
keywords = ["supermoon", "moon", "perigee", "full moon", "astronomy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
test = ["pytest", "pytz", "requests", "beautifulsoup4", "lxml"]

[project.urls]
Homepage = "https://github.com/rtphokie/supermoon"
Issues = "https://github.com/rtphokie/supermoon/issues"

[project.scripts]
supermoon = "supermoon.cli:main"

[tool.setuptools]
packages = ["supermoon"]

[tool.setuptools.dynamic]
version = {attr = "supermoon.__version__"}
